stylesheets:
- /linen-theme/css/linen.css

scripts:
- /linen-theme/js/linen.js

# Color scheme: auto (follows system prefers-color-scheme) | light | dark
colorScheme: auto
# Show light/dark theme toggle button in the header
themeToggle: true

# Opt-in client-side local search (generates a lightweight JSON index on build)
search:
  enable: false
  path: linen-theme/search-index.json
  content: true

post:
  # Editorial breakout: constrain prose to a comfortable reading width while
  # allowing photos, image grids, tables, and wide embeds to break out full width
  editorialBreakout: false
  proseWidth: 720px
  # Default post typography style: editorial | journal
  layoutStyle: editorial
  # Optional per-series layoutStyle overrides, e.g.:
  # seriesLayoutStyle:
  #   Travel: journal
  seriesLayoutStyle: {}

sass:
  outputStyle: compressed
